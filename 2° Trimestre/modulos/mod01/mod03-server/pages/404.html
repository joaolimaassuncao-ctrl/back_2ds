<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página Não Encontrada | Oficina Mecânica</title>
    <!-- Ícones Modernos -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff4d00;
            --dark: #111111;
            --gray: #1e1e1e;
            --light: #ffffff;
            --text-gray: #aaaaaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Imagem de Fundo (Mesmo padrão visual) */
        .bg-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(17, 17, 17, 0.85), rgba(17, 17, 17, 0.95)), 
                              url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Card Principal */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(30, 30, 30, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 77, 0, 0.2);
            padding: 3rem 2.5rem;
            border-radius: 16px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* Código do Erro em Destaque */
        .error-code {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            color: var(--primary);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        /* Ícone Alinhado ao Tema */
        .icon-box {
            font-size: 2.5rem;
            color: var(--text-gray);
            margin-bottom: 1.5rem;
            animation: spin-slow 4s linear infinite;
        }

        h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            color: var(--text-gray);
            font-size: 1rem;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        /* Botão para Voltar à Homepage */
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary);
            color: var(--light);
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 77, 0, 0.3);
        }

        .btn-home:hover {
            background: #e04400;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 77, 0, 0.5);
        }

        .btn-home i {
            transition: transform 0.3s ease;
        }

        .btn-home:hover i {
            transform: translateX(-4px);
        }

        /* Animação suave para a engrenagem */
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Fundo Visual -->
    <div class="bg-background"></div>

    <!-- Conteúdo da Página 404 -->
    <div class="card">
        <div class="error-code">404</div>
        
        <div class="icon-box">
            <i class="fa-solid fa-gear"></i>
        </div>
        
        <h3>Motor de busca quebrado!</h3>
        <p>A página que você está procurando bateu as bielas ou nunca saiu da linha de montagem.</p>  
        
        <!-- Link de retorno para a rota raiz -->
        <a href="/" class="btn-home">
            <i class="fa-solid fa-arrow-left"></i> Voltar para a Oficina
        </a>
    </div>

</body>
</html>
