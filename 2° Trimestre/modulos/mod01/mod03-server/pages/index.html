<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oficina Mecânica | Página Inicial</title>

    <!-- Ícones Modernos -->

    <link rel="stylesheet" href="https://cloudflare.com">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://googleapis.com">

    <link rel="preconnect" href="https://gstatic.com" crossorigin>

    <link href="https://googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

   

    <style>

        :root {

            --primary: #ff4d00;

            --dark: #111111;

            --gray: #1e1e1e;

            --light: #ffffff;

            --text-gray: #aaaaaa;

        }



        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family: 'Poppins', sans-serif;

        }



        body {

            background-color: var(--dark);

            color: var(--light);

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            overflow: hidden;

            position: relative;

        }



        /* Imagem de Fundo Otimizada (Unsplash) */

        .bg-background {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background-image: linear-gradient(rgba(17, 17, 17, 0.85), rgba(17, 17, 17, 0.95)),

                              url('https://unsplash.com');

            background-size: cover;

            background-position: center;

            z-index: 1;

        }



        /* Card Principal */

        .card {

            position: relative;

            z-index: 2;

            background: rgba(30, 30, 30, 0.65);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 77, 0, 0.2);

            padding: 2.5rem;

            border-radius: 16px;

            text-align: center;

            max-width: 450px;

            width: 90%;

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);

        }



        /* Ícone de Destaque */

        .icon-box {

            width: 80px;

            height: 80px;

            background: rgba(255, 77, 0, 0.1);

            border: 2px solid var(--primary);

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 1.5rem;

            color: var(--primary);

            font-size: 2rem;

            animation: pulse 2s infinite;

        }



        h3 {

            font-size: 2rem;

            font-weight: 700;

            margin-bottom: 0.5rem;

            letter-spacing: 1px;

            text-transform: uppercase;

        }



        p {

            color: var(--text-gray);

            font-size: 1.1rem;

            margin-bottom: 2rem;

        }



        /* Link com a Rota Mantida */

        .btn-link {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            background: var(--primary);

            color: var(--light);

            text-decoration: none;

            padding: 1rem 2rem;

            border-radius: 8px;

            font-weight: 600;

            font-size: 1rem;

            transition: all 0.3s ease;

            width: 100%;

            box-shadow: 0 4px 15px rgba(255, 77, 0, 0.3);

        }



        .btn-link:hover {

            background: #e04400;

            transform: translateY(-2px);

            box-shadow: 0 6px 20px rgba(255, 77, 0, 0.5);

        }



        .btn-link i {

            transition: transform 0.3s ease;

        }



        .btn-link:hover i {

            transform: translateX(4px);

        }



        /* Animação */

        @keyframes pulse {

            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 77, 0, 0.4); }

            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(255, 77, 0, 0); }

            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 77, 0, 0); }

        }

    </style>

</head>

<body>



    <!-- Fundo Visual -->

    <div class="bg-background"></div>



    <!-- Conteúdo da Página -->

    <div class="card">

        <div class="icon-box">

            <i class="fa-solid fa-screwdriver-wrench"></i>

        </div>

        <h3>Página Inicial</h3>

        <p>Olá, você está em casa!</p>  

       

        <!-- Mantida a rota exata /sobre -->

        <a href="/sobre" class="btn-link">

            Conhecer a Oficina <i class="fa-solid fa-arrow-right"></i>

        </a>

    </div>



</body>

</html>
